# golangci-lint configuration
# https://golangci-lint.run/usage/configuration/

version: 2

run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck  # Includes gosimple rules in v2.x
    - unused
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - gosec
    - prealloc
    - copyloopvar
    - gocritic

  exclusions:
    rules:
      # Exclude all linters from test files
      - path: '(.+)_test\.go'
        linters:
          - errcheck
          - gocritic
          - gosec

      # Exclude gosec from test infrastructure (harness and integration helpers)
      - path: '(harness|integration)/'
        linters:
          - gosec

      # Exclude gosec file permissions from init command (creates user config files)
      - path: 'internal/cmd/initcmd/'
        linters:
          - gosec
        text: 'G301'

formatters:
  enable:
    - gofmt
    - goimports

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true
    exclude-functions:
      - (io.Closer).Close
      - (*go.uber.org/zap.Logger).Sync
      - (os.File).Close

  govet:
    enable-all: true
    disable:
      - fieldalignment  # Disabled: manual field ordering for clarity over memory optimization

  misspell:
    locale: US

  gosec:
    excludes:
      - G104 # Audit errors not checked (we handle in specific cases)
      - G304 # File path provided as taint input (config files)

  gocritic:
    enabled-tags:
      - diagnostic
      - style
      - performance
    disabled-checks:
      - hugeParam

formatters-settings:
  gofmt:
    simplify: true

  goimports:
    local-prefixes: github.com/certwatch-app/cw-agent

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

# golangci-lint configuration (v2 format)
# https://golangci-lint.run/usage/configuration/

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - bodyclose
    - noctx
    - gosec
    - prealloc
    - copyloopvar
    - gocritic

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
      exclude-functions:
        - (io.Closer).Close
        - (*go.uber.org/zap.Logger).Sync
        - (os.File).Close

    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
        - unusedwrite

    misspell:
      locale: US

    gosec:
      excludes:
        - G104
        - G304

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - unnamedResult
        - paramTypeCombine
        - importShadow
        - octalLiteral
        - httpNoBody

  exclusions:
    rules:
      # Exclude linters from test files
      - path: _test\.go
        linters:
          - errcheck
          - gocritic
          - gosec
          - govet
          - misspell

      # Exclude from test infrastructure
      - path: harness/
        linters:
          - errcheck
          - gocritic
          - gosec

      - path: integration/
        linters:
          - errcheck
          - gocritic
          - gosec

      # Exclude gosec file permissions from init command
      - path: internal/cmd/initcmd/
        linters:
          - gosec
        text: 'G301'

    # Exclude entire directories from all linting
    paths:
      - "internal/ca/integration/"
      - "internal/ca/testing_helpers.go"

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

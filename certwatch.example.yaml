# CertWatch Agent Configuration
# Copy this file to certwatch.yaml and update with your settings

# API Configuration
api:
  # CertWatch API endpoint
  endpoint: "https://api.certwatch.app"

  # API key with 'cloud:sync' scope
  # Get this from your CertWatch dashboard: Settings > API Keys
  key: "cw_xxxxxxxx_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

  # Request timeout
  timeout: 30s

# Agent Configuration
agent:
  # Unique name for this agent (appears in dashboard)
  name: "production-monitor"

  # How often to sync data with CertWatch cloud
  sync_interval: 5m

  # How often to scan certificates locally
  scan_interval: 1m

  # Maximum concurrent certificate scans
  concurrency: 10

  # Log level: debug, info, warn, error
  log_level: info

# Certificate Authority (CA) Validation Configuration (Optional)
# By default, certificates are validated against the system's trusted CA store.
# Use this section to customize CA validation behavior.
#
# ca:
#   # Trust Mode - which CA certificates to trust
#   # Options:
#   #   - "system"   : Use only the operating system's trusted CA store (default)
#   #   - "custom"   : Use only custom CA bundles specified below
#   #   - "combined" : Trust both system CAs and custom CA bundles
#   trust_mode: "system"
#
#   # Validation Mode - how strictly to validate certificates
#   # Options:
#   #   - "none"  : Skip CA validation (useful for self-signed certs)
#   #   - "basic" : Basic validation (expiry, hostname, signature)
#   #   - "chain" : Full chain validation using x509.Verify (default)
#   validation_mode: "chain"
#
#   # CA Bundle Files - paths to PEM-encoded CA certificate bundles
#   # Used when trust_mode is "custom" or "combined"
#   ca_bundles:
#     - "/etc/ssl/certs/internal-ca.pem"
#     - "/path/to/custom-root-ca.crt"
#
#   # Inline CA Certificates - PEM-encoded CA certificates
#   # Useful for embedding CAs directly in config (e.g., in Kubernetes ConfigMaps)
#   inline_certs:
#     - |
#       -----BEGIN CERTIFICATE-----
#       MIIDXTCCAkWgAwIBAgIJAKL0UG+mRKUzMA0GCSqGSIb3DQEBCwUAMEUxCzAJBgNV
#       ... (your CA certificate) ...
#       -----END CERTIFICATE-----

# Certificates to Monitor
certificates:
  # Example: Monitor a web server
  - hostname: "www.example.com"
    port: 443
    tags:
      - production
      - web
    notes: "Main website"

  # Example: Monitor an API endpoint
  - hostname: "api.example.com"
    port: 443
    tags:
      - production
      - api
    notes: "REST API"

  # Example: Monitor a mail server
  - hostname: "mail.example.com"
    port: 993
    tags:
      - production
      - mail
    notes: "IMAP server"

  # Example: Monitor internal service
  - hostname: "internal-service.local"
    port: 8443
    tags:
      - internal
    notes: "Internal microservice"

  # Example: Per-certificate CA override
  # You can override the global CA configuration for specific certificates
  # - hostname: "internal-app.corp"
  #   port: 443
  #   tags:
  #     - internal
  #   notes: "Internal app with custom CA"
  #   ca:
  #     trust_mode: "custom"
  #     validation_mode: "chain"
  #     ca_bundles:
  #       - "/etc/ssl/certs/internal-corp-ca.pem"
